version: 2

# One weekly PR for every ecosystem, so a batch of dependency changes costs one
# CI run. Pre-1.0 minor bumps are breaking (resvg 0.47 -> 0.48 swapped its whole
# text-shaping backend), so read the PR before merging it; or treat it as the
# signal to update everything locally and run `just ci` once.
multi-ecosystem-groups:
  all-deps:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: "/"
    multi-ecosystem-group: all-deps
    patterns:
      - "*"
    ignore:
      # 0.2.3 reports U+FF9E and U+FF9F as width 1, so the +1 for halfwidth
      # sound marks in terminal_width and in ratatui-core counts them twice.
      # Drop this once ratatui adjusts.
      - dependency-name: unicode-width
        versions:
          - ">= 0.2.3"

  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: all-deps
    patterns:
      - "*"
