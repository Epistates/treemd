name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, as in rust.yml, which says why.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full CI suite (rust.yml) on the exact commit being released. Nothing
  # is built for release until it passes, so a tag pushed on a red or
  # untested commit stops here instead of publishing.
  ci:
    name: CI
    uses: ./.github/workflows/rust.yml

  # A pushed tag is immutable (see the "Version tags are immutable" ruleset), so
  # a bad one cannot be re-cut. Catch the mismatches here, before any artifact
  # exists, rather than after downstream packagers have hashed the tarball.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Tag, Cargo.toml, and CHANGELOG must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"

          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "treemd") | .version')
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

          echo "$GITHUB_REF_NAME matches Cargo.toml and CHANGELOG.md"
        shell: bash

      # Everything `cargo publish` checks short of uploading, so the
      # crates.io publish of this tag is known to go through.
      - name: crates.io publish dry run
        run: cargo publish --dry-run --locked

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [ci, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          # Linux x86_64 (musl - for Alpine/static linking)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
          # Linux ARM64 (glibc)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
          # Linux ARM64 (musl - for Alpine/static linking)
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
          # macOS x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          shared-key: ${{ matrix.target }}

      # Install cross for Linux ARM builds
      # Using cargo install from git since there are no recent releases
      # (last release v0.2.5 was in Feb 2023, but development is active)
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8633ec65ab914015c2444c732568b414bd3c47cf --locked

      # For Linux ARM, we need proper configuration
      - name: Create .cargo/config.toml for Linux ARM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          ar = "aarch64-linux-gnu-ar"
          EOF

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      # Create artifact name based on target
      - name: Determine artifact name
        id: artifact
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "bin=treemd.exe" >> $GITHUB_OUTPUT
          else
            echo "bin=treemd" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # A tagged release must be Developer ID signed and notarized, so on a
      # tag a failed import fails the job. A manual run without the signing
      # secrets carries on and is ad-hoc signed below.
      - name: Import Apple code signing certificate
        if: runner.os == 'macOS'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: Apple-Actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign and notarize the macOS binary
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bin="target/$TARGET/release/treemd"

          if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "Signing with Developer ID"
            codesign --force --timestamp --options runtime \
              --sign "$APPLE_DEVELOPER_ID" "$bin"
            codesign --verify --strict --verbose=2 "$bin"

            # notarytool exits 0 even when Apple rejects the submission, so
            # the verdict is read from its JSON rather than its exit code.
            ditto -c -k --sequesterRsrc "$bin" treemd-notarize.zip
            result=$(xcrun notarytool submit treemd-notarize.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m --output-format json)
            echo "$result"
            status=$(jq -r '.status' <<<"$result")
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$(jq -r '.id' <<<"$result")" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              echo "::error::notarization finished as '$status', not Accepted"
              exit 1
            fi
            # A bare binary cannot be stapled; Gatekeeper checks the
            # notarization online the first time it runs.
            echo "Signed and notarized"
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::no Developer ID Application identity is available, and a tagged release must be signed and notarized"
            exit 1
          else
            echo "::warning::no Developer ID identity, so this non-release build is ad-hoc signed only"
            codesign --force --sign - "$bin"
            codesign --verify --verbose=2 "$bin"
          fi
        shell: bash


      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          # Create artifacts directory
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $binary = "treemd-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/treemd.exe" $binary

          # Create zip for Windows (tar.gz not common on Windows)
          Compress-Archive -Path $binary -DestinationPath "artifacts/$binary.zip"

          # Generate SHA256
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          "$hash  $binary" | Out-File -FilePath "artifacts/$binary.sha256" -Encoding ascii -NoNewline

          Write-Host "Binary info:"
          Get-Item $binary | Format-List Length, LastWriteTime
          Get-Content "artifacts/$binary.sha256"
        shell: pwsh

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          BINARY="treemd-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/treemd" "$BINARY"
          chmod +x "$BINARY"

          # Create tar to preserve permissions and prevent corruption
          tar -czf "artifacts/$BINARY.tar.gz" "$BINARY"
          sha256sum "$BINARY" > "artifacts/$BINARY.sha256"
          ls -lh "$BINARY"
          cat "artifacts/$BINARY.sha256"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p final-release

          # Copy archives directly (tar.gz and zip preserve permissions internally)
          find release-artifacts -name "*.tar.gz" -type f -exec cp {} final-release/ \;
          find release-artifacts -name "*.zip" -type f -exec cp {} final-release/ \;

          # Copy individual SHA256 files
          find release-artifacts -name "*.sha256" -type f -exec cp {} final-release/ \;

          echo "Final release contents:"
          ls -lah final-release/

          echo "Verifying archive integrity:"
          cd final-release
          for archive in *.tar.gz; do
            [ -f "$archive" ] || continue
            echo "Testing $archive:"
            tar -tzf "$archive" | head -5
          done
          for archive in *.zip; do
            [ -f "$archive" ] || continue
            echo "Testing $archive:"
            unzip -l "$archive"
          done
        shell: bash

      - name: Generate combined checksums
        run: |
          cd final-release
          # Generate SHA256SUMS for archives (not individual binaries)
          sha256sum *.tar.gz *.zip 2>/dev/null | grep -v "No such file" > SHA256SUMS || true
          cat SHA256SUMS
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            final-release/*.tar.gz
            final-release/*.zip
            final-release/*.sha256
            final-release/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
